name: Daily scrape and alert

on:
  schedule:
    - cron: "0 22 * * *"  # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare CA bundle (metaverse-campus.kr sends an incomplete cert chain)
        run: |
          CERTIFI_PATH=$(python3 -c "import certifi; print(certifi.where())")
          cp "$CERTIFI_PATH" /tmp/ca-bundle.pem
          if curl -sS -f -o /tmp/rapidssl-intermediate.pem https://cacerts.digicert.com/RapidSSLTLSRSACAG1.crt.pem; then
            cat /tmp/rapidssl-intermediate.pem >> /tmp/ca-bundle.pem
            echo "REQUESTS_CA_BUNDLE=/tmp/ca-bundle.pem" >> "$GITHUB_ENV"
          else
            echo "[WARN] RapidSSL 중간 인증서 다운로드 실패 — 기본 CA 번들 사용 (metaverse-campus.kr 계속 실패할 수 있음)"
          fi

      - name: Run scraper
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: python main.py

      - name: Commit updated data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "chore: update scraped data ($(date -u +%Y-%m-%d))"
          git push
